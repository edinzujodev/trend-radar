<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Radar</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #646b78; --line: #e3e6eb;
    --accent: #3b5bdb; --accent-soft: #e8edff; --hot: #d9480f; --good: #2b8a3e;
    --s-news: #3b5bdb; --s-reddit: #e8590c; --s-hn: #f08c00; --s-github: #495057;
    --s-bluesky: #1c7ed6; --s-mastodon: #7048e8; --s-dev: #0ca678;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e8eaef; --muted: #9aa1ad; --line: #2a2f3a;
      --accent: #748ffc; --accent-soft: #1e2440; --hot: #ff8a4c; --good: #51cf66;
      --s-github: #adb5bd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 0 0 18px; color: var(--muted); }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { font: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: 10px 14px; }
  input { flex: 1 1 260px; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .chip { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); cursor: pointer; font-size: 13px; }
  .chip:hover { color: var(--ink); border-color: var(--accent); }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 18px 0; font-size: 13px; color: var(--muted); }
  .status span.bad { color: var(--hot); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 4px; font-size: 15px; }
  .panel .sub { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  .term { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .term:hover, .term.on { background: var(--accent-soft); }
  .term .name { font-weight: 600; overflow-wrap: anywhere; }
  .term .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .cloud { display: flex; flex-wrap: wrap; gap: 6px; }
  .cloud .chip { color: var(--ink); }
  .cloud .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .filters .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .active-term { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .active-term b { color: var(--ink); }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item .t { font-weight: 550; overflow-wrap: anywhere; }
  .item .m { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; color: #fff; margin-right: 6px; }
  .gt { padding: 8px 0; border-top: 1px solid var(--line); }
  .gt:first-of-type { border-top: 0; }
  .gt .m { font-size: 12.5px; color: var(--muted); }
  .wiki { display: grid; grid-template-columns: 1fr 70px 52px; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; }
  .up { color: var(--good); font-weight: 700; font-size: 12.5px; text-align: right; }
  .flat { color: var(--muted); font-size: 12.5px; text-align: right; }
  svg.spark { width: 70px; height: 22px; }
  .empty { color: var(--muted); font-size: 13.5px; }
  .loading { padding: 40px 0; text-align: center; color: var(--muted); }
  mark { background: #ffe066; color: #000; border-radius: 3px; padding: 0 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Trend Radar</h1>
    <p>Type a topic or group to see what's trending in it right now on news, Reddit, Hacker News, GitHub, Bluesky, Mastodon, DEV, Google Trends and Wikipedia.</p>
  </header>

  <form id="f">
    <input id="q" placeholder="e.g. software, AI, gaming, crypto, football…" autocomplete="off">
    <select id="geo" title="Country for Google News and Google Trends">
      <option value="US">United States</option><option value="GB">United Kingdom</option>
      <option value="CA">Canada</option><option value="AU">Australia</option><option value="IN">India</option>
      <option value="IE">Ireland</option><option value="NZ">New Zealand</option><option value="ZA">South Africa</option>
    </select>
    <button>Find trends</button>
  </form>
  <div class="chips" id="presets"></div>

  <div id="out"></div>
</div>

<script>
const SOURCES = {
  "Google News": "var(--s-news)", "Reddit": "var(--s-reddit)", "Hacker News": "var(--s-hn)",
  "GitHub": "var(--s-github)", "Bluesky": "var(--s-bluesky)", "Mastodon": "var(--s-mastodon)", "DEV": "var(--s-dev)",
};
const KEY_NAMES = { news: "Google News", reddit: "Reddit", hackernews: "Hacker News", github: "GitHub",
  bluesky: "Bluesky", mastodon: "Mastodon", devto: "DEV" };
const PRESETS = ["software", "AI", "gaming", "cybersecurity", "crypto", "music", "movies", "football", "science", "startups"];

const $ = (s) => document.querySelector(s);
const esc = (s = "") => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let data = null, activeTerm = null, activeSource = "All";

$("#presets").innerHTML = PRESETS.map((p) => `<span class="chip" data-q="${p}">${p}</span>`).join("");
$("#presets").onclick = (e) => { const q = e.target.dataset.q; if (q) { $("#q").value = q; search(); } };
$("#f").onsubmit = (e) => { e.preventDefault(); search(); };

function ago(t) {
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  if (!isFinite(m)) return "";
  if (m < 60) return `${m}m ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)}h ago`;
  return `${Math.round(m / 1440)}d ago`;
}

async function search() {
  const q = $("#q").value.trim();
  if (!q) return;
  const geo = $("#geo").value;
  history.replaceState(null, "", `?q=${encodeURIComponent(q)}&geo=${geo}`);
  $("#out").innerHTML = `<div class="loading">Gathering trends for “${esc(q)}” from 9 sources…</div>`;
  try {
    const res = await fetch(`/api/trends?q=${encodeURIComponent(q)}&geo=${geo}`);
    data = await res.json();
    if (data.error) throw new Error(data.error);
    activeTerm = null; activeSource = "All";
    render();
  } catch (e) {
    $("#out").innerHTML = `<div class="loading">Something went wrong: ${esc(e.message)}</div>`;
  }
}

function termRow(t, max) {
  const share = (t.score / max) * 100;
  const segs = t.sources.map((s) => `<i style="width:${share / t.sources.length}%;background:${SOURCES[s]}"></i>`).join("");
  return `<div class="term ${activeTerm === t.term ? "on" : ""}" data-term="${esc(t.term)}">
    <span class="name">${esc(t.term)}</span>
    <span class="n">${t.count} posts · ${t.sources.length} site${t.sources.length > 1 ? "s" : ""}</span>
    <span class="bar">${segs}</span></div>`;
}

function spark(series) {
  const max = Math.max(...series), min = Math.min(...series), w = 70, h = 22;
  const pts = series.map((v, i) => `${(i / (series.length - 1)) * w},${h - 2 - ((v - min) / (max - min || 1)) * (h - 4)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

function render() {
  const d = data;
  const status = Object.entries(d.status).map(([k, v]) =>
    v.ok ? `<span><span class="dot" style="background:${SOURCES[KEY_NAMES[k]]}"></span>${KEY_NAMES[k]} ${v.count}</span>`
         : `<span class="bad" title="${esc(v.error)}">✕ ${KEY_NAMES[k]} unavailable</span>`).join("");

  const phrases = d.terms.phrases, words = d.terms.words;
  const maxW = Math.max(1, ...words.map((t) => t.score));
  const maxP = Math.max(1, ...phrases.map((t) => t.score));

  const gt = d.googleTrends;
  const gtHtml = gt.matches.length
    ? gt.matches.map((m) => `<div class="gt"><b>${esc(m.term)}</b> <span class="m">${esc(m.traffic)} searches</span>
        ${m.news[0] ? `<div class="m"><a href="${esc(m.news[0].url)}" target="_blank">${esc(m.news[0].title)}</a></div>` : ""}</div>`).join("")
    : `<p class="empty">Nothing about “${esc(d.query)}” in today's top searches. Overall top searches right now:</p>
       <div class="cloud">${gt.top.map((t) => `<span class="chip" title="${esc(t.traffic)}">${esc(t.term)}</span>`).join("")}</div>`;

  const wikiHtml = d.wikipedia.length
    ? d.wikipedia.slice(0, 8).map((w) => {
        const pct = Math.round((w.change - 1) * 100);
        return `<div class="wiki"><a href="${w.url}" target="_blank">${esc(w.title)}</a>${spark(w.series)}
          <span class="${pct >= 15 ? "up" : "flat"}">${pct >= 0 ? "+" : ""}${pct}%</span></div>`;
      }).join("")
    : `<p class="empty">No Wikipedia data.</p>`;

  $("#out").innerHTML = `
    <div class="status">${status}<span>· updated ${ago(d.fetchedAt)}</span></div>
    <div class="grid">
      <div>
        <div class="panel">
          <h2>Trending phrases</h2>
          <p class="sub">Word pairs showing up across many posts. Click one to see the posts.</p>
          ${phrases.length ? phrases.slice(0, 12).map((t) => termRow(t, maxP)).join("") : `<p class="empty">Not enough overlap yet.</p>`}
        </div>
        <div class="panel">
          <h2>Trending words</h2>
          <p class="sub">Ranked by how many people use them, engagement, and how many sites they appear on. Bar colours show which sites.</p>
          ${words.slice(0, 25).map((t) => termRow(t, maxW)).join("")}
        </div>
      </div>
      <div>
        <div class="panel">
          <h2>Google Trends today (${esc(d.geo)})</h2>
          <p class="sub">Top searches mentioning your topic.</p>
          ${gtHtml}
        </div>
        <div class="panel">
          <h2>Wikipedia interest</h2>
          <p class="sub">Related articles: views over the last 2 days compared with the 2 weeks before.</p>
          ${wikiHtml}
        </div>
        <div class="panel" id="items"></div>
      </div>
    </div>`;

  document.querySelectorAll(".term").forEach((el) => el.onclick = () => {
    activeTerm = activeTerm === el.dataset.term ? null : el.dataset.term;
    document.querySelectorAll(".term").forEach((x) => x.classList.toggle("on", x.dataset.term === activeTerm));
    renderItems();
    if (activeTerm && innerWidth < 860) $("#items").scrollIntoView({ behavior: "smooth" });
  });
  renderItems();
}

function renderItems() {
  const d = data;
  let items = d.items;
  let hl = null;
  if (activeTerm) {
    const t = [...d.terms.phrases, ...d.terms.words].find((x) => x.term === activeTerm);
    const ids = new Set(t ? t.items : []);
    items = items.filter((i) => ids.has(i.id));
    hl = new RegExp(`(${activeTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "\\W+")})`, "gi");
  }
  const counts = { All: items.length };
  items.forEach((i) => counts[i.source] = (counts[i.source] || 0) + 1);
  if (activeSource !== "All") items = items.filter((i) => i.source === activeSource);

  // Blend rank-within-site with overall engagement, so each site's best posts surface
  // but a post with 3 reposts doesn't outrank one with 900 likes
  const max = {};
  d.items.forEach((i) => max[i.source] = Math.max(max[i.source] || 0, i.score || 0));
  const top = Math.log1p(Math.max(1, ...Object.values(max)));
  const rank = (i) => {
    if (!max[i.source]) return 0.45; // news/reddit have no counts
    const within = Math.log1p(i.score) / Math.log1p(max[i.source]);
    return within * Math.sqrt(Math.log1p(max[i.source]) / top);
  };
  items = [...items].sort((a, b) => rank(b) - rank(a) || new Date(b.time) - new Date(a.time)).slice(0, 80);

  const mark = (s) => hl ? esc(s).replace(hl, "<mark>$1</mark>") : esc(s);
  const filters = ["All", ...Object.keys(SOURCES)].filter((s) => counts[s])
    .map((s) => `<span class="chip ${activeSource === s ? "on" : ""}" data-src="${s}">${s} ${counts[s]}</span>`).join("");

  $("#items").innerHTML = `
    <h2>Top posts</h2>
    <p class="sub">Most-engaged posts from the last day or two.</p>
    ${activeTerm ? `<div class="active-term">Showing posts that mention <b>${esc(activeTerm)}</b> · <a href="#" id="clear">clear</a></div>` : ""}
    <div class="filters">${filters}</div>
    ${items.map((i) => `<div class="item">
      <div class="t"><span class="badge" style="background:${SOURCES[i.source]}">${i.source}</span>
        <a href="${esc(i.url)}" target="_blank" rel="noopener">${mark(i.title)}</a></div>
      <div class="m">${esc(i.meta || "")}${i.meta ? " · " : ""}${ago(i.time)}</div>
    </div>`).join("") || `<p class="empty">No posts.</p>`}`;

  $("#items .filters").onclick = (e) => {
    if (!e.target.dataset.src) return;
    activeSource = e.target.dataset.src;
    renderItems();
  };
  const c = $("#clear");
  if (c) c.onclick = (e) => {
    e.preventDefault(); activeTerm = null;
    document.querySelectorAll(".term").forEach((x) => x.classList.remove("on"));
    renderItems();
  };
}

const params = new URLSearchParams(location.search);
if (params.get("geo")) $("#geo").value = params.get("geo");
if (params.get("q")) { $("#q").value = params.get("q"); search(); }
</script>
</body>
</html>
