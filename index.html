<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Radar</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #646b78; --line: #e3e6eb;
    --accent: #3b5bdb; --accent-soft: #e8edff; --hot: #d9480f; --good: #2b8a3e;
    --s-news: #3b5bdb; --s-reddit: #e8590c; --s-hn: #f08c00; --s-github: #495057;
    --s-bluesky: #1098ad; --s-mastodon: #7048e8; --s-dev: #0ca678;
    --cmp-a: var(--accent); --cmp-b: #c2255c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e8eaef; --muted: #9aa1ad; --line: #2a2f3a;
      --accent: #748ffc; --accent-soft: #1e2440; --hot: #ff8a4c; --good: #51cf66;
      --s-github: #adb5bd; --s-bluesky: #15aabf; --cmp-b: #f06595;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 0 0 18px; color: var(--muted); }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { font: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: 10px 14px; }
  input { flex: 1 1 260px; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .chip { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); cursor: pointer; font-size: 13px; }
  .chip:hover { color: var(--ink); border-color: var(--accent); }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 18px 0; font-size: 13px; color: var(--muted); }
  .status span.bad { color: var(--hot); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 4px; font-size: 15px; }
  .panel .sub { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  .term { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .term:hover, .term.on { background: var(--accent-soft); }
  .term .name { font-weight: 600; overflow-wrap: anywhere; }
  .term .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .mv { font-size: 11px; font-weight: 700; margin-left: 6px; }
  .mv.new { color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .mv.up { color: var(--good); }
  .mv.down { color: var(--hot); }
  .dropped { margin: 10px 8px 0; font-size: 12.5px; color: var(--muted); }
  .term.alert { box-shadow: inset 3px 0 0 var(--hot); }
  .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .cloud { display: flex; flex-wrap: wrap; gap: 6px; }
  .cloud .chip { color: var(--ink); }
  .cloud .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .filters .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .active-term { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .active-term b { color: var(--ink); }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item .t { font-weight: 550; overflow-wrap: anywhere; }
  .item .m { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; color: #fff; margin-right: 6px; }
  h3.src { margin: 18px 0 2px; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  h3.src .m { font-weight: 400; color: var(--muted); }
  .gt { padding: 8px 0; border-top: 1px solid var(--line); }
  .gt:first-of-type { border-top: 0; }
  .gt .m { font-size: 12.5px; color: var(--muted); }
  .wiki { display: grid; grid-template-columns: 1fr 70px 52px; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; }
  .up { color: var(--good); font-weight: 700; font-size: 12.5px; text-align: right; }
  .flat { color: var(--muted); font-size: 12.5px; text-align: right; }
  svg.spark { width: 70px; height: 22px; }
  .empty { color: var(--muted); font-size: 13.5px; }
  .loading { padding: 40px 0; text-align: center; color: var(--muted); }
  .glance { margin-top: 18px; }
  .glance p { margin: 0 0 6px; }
  .glance .big { margin-bottom: 8px; }
  .glance .status { margin: 10px 0 0; }
  section { margin-top: 28px; }
  h2.sec { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 14px; }
  .sec-sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; max-width: 900px; }
  .howto { display: block; margin-top: 4px; font-size: 12.5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 4px 0; }
  .auto { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .auto input { flex: none; margin: 0; }
  .banner { background: var(--panel); border: 1px solid var(--hot); border-left-width: 4px; border-radius: 10px;
    padding: 10px 14px; margin: 18px 0 0; font-size: 14px; }
  .banner b { color: var(--hot); }
  .cmp-row { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; align-items: center; padding: 6px 0; font-size: 13px; }
  .cmp-row .bar { grid-column: 2; height: 8px; border-radius: 4px; }
  .cmp-row .n { grid-column: 2; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .cmp-head { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; }
  .cmp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .cmp-grid { grid-template-columns: minmax(0, 1fr); } }
  .cmp-a { color: var(--cmp-a); } .cmp-b { color: var(--cmp-b); }
  .big { font-size: 17px; margin: 4px 0 14px; }
  mark { background: #ffe066; color: #000; border-radius: 3px; padding: 0 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Trend Radar</h1>
    <p>Type a topic or group to see what's trending in it right now on news, Reddit, Hacker News, GitHub, Bluesky, Mastodon, DEV, Google Trends and Wikipedia.</p>
  </header>

  <form id="f">
    <input id="q" placeholder="e.g. software, AI, gaming… or compare: AI vs crypto" autocomplete="off">
    <select id="geo" title="Country for Google News and Google Trends">
      <option value="US">United States</option><option value="GB">United Kingdom</option>
      <option value="CA">Canada</option><option value="AU">Australia</option><option value="IN">India</option>
      <option value="IE">Ireland</option><option value="NZ">New Zealand</option><option value="ZA">South Africa</option>
    </select>
    <button>Find trends</button>
    <label class="auto" title="Re-check every 10 minutes and flag anything new in the top 10"><input type="checkbox" id="auto"> Auto-refresh</label>
  </form>
  <div class="chips" id="presets"></div>

  <div id="out"></div>
</div>

<script>
const SOURCES = {
  "Google News": "var(--s-news)", "Reddit": "var(--s-reddit)", "Hacker News": "var(--s-hn)",
  "GitHub": "var(--s-github)", "Bluesky": "var(--s-bluesky)", "Mastodon": "var(--s-mastodon)", "DEV": "var(--s-dev)",
};
const KEY_NAMES = { news: "Google News", reddit: "Reddit", hackernews: "Hacker News", github: "GitHub",
  bluesky: "Bluesky", mastodon: "Mastodon", devto: "DEV" };
const PER_SOURCE = 20;
const PRESETS = ["software", "AI", "gaming", "cybersecurity", "crypto", "music", "movies", "football", "science", "startups", "AI vs crypto"];
const REFRESH_MS = 10 * 60 * 1000 + 15000; // just past the server's 10-minute cache
const ALERT_TOP = 10;

const $ = (s) => document.querySelector(s);
const esc = (s = "") => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let data = null, activeTerm = null, activeSource = "All";
let alerts = new Set(), timer = null;
const TITLE = document.title;

$("#presets").innerHTML = PRESETS.map((p) => `<span class="chip" data-q="${p}">${p}</span>`).join("");
$("#presets").onclick = (e) => { const q = e.target.dataset.q; if (q) { $("#q").value = q; search(); } };
$("#f").onsubmit = (e) => { e.preventDefault(); search(); };
$("#auto").onchange = (e) => {
  clearInterval(timer);
  if (!e.target.checked) return;
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  timer = setInterval(() => search({ silent: true }), REFRESH_MS);
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = TITLE; });

function ago(t) {
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  if (!isFinite(m)) return "";
  if (m < 1) return "just now";
  if (m < 60) return `${m}m ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)}h ago`;
  return `${Math.round(m / 1440)}d ago`;
}

async function fetchTrends(q, geo) {
  const res = await fetch(`/api/trends?q=${encodeURIComponent(q)}&geo=${geo}`);
  const d = await res.json();
  if (d.error) throw new Error(d.error);
  return d;
}

const topTerms = (d) => new Set([...d.terms.phrases.slice(0, ALERT_TOP), ...d.terms.words.slice(0, ALERT_TOP)].map((t) => t.term));

// silent = an auto-refresh: keep the reader's place and flag terms new to the top 10
async function search({ silent = false } = {}) {
  const q = $("#q").value.trim();
  if (!q) return;
  const geo = $("#geo").value;
  const pair = q.split(/\s+vs\.?\s+/i).map((s) => s.trim()).filter(Boolean);
  if (!silent) {
    history.replaceState(null, "", `?q=${encodeURIComponent(q)}&geo=${geo}`);
    $("#out").innerHTML = `<div class="loading">Gathering trends for “${esc(q)}” from 9 sources…</div>`;
  }
  try {
    if (pair.length === 2) {
      const [a, b] = await Promise.all(pair.map((p) => fetchTrends(p, geo)));
      data = null;
      return renderCompare(a, b);
    }
    const next = await fetchTrends(q, geo);
    if (silent && data && data.query === next.query) {
      const before = topTerms(data);
      alerts = new Set([...topTerms(next)].filter((t) => !before.has(t)));
      if (alerts.size) notify(q, [...alerts]);
      if (![...next.terms.phrases, ...next.terms.words].some((t) => t.term === activeTerm)) activeTerm = null;
    } else {
      alerts = new Set(); activeTerm = null; activeSource = "All";
    }
    data = next;
    render();
  } catch (e) {
    if (!silent) $("#out").innerHTML = `<div class="loading">Something went wrong: ${esc(e.message)}</div>`;
  }
}

function notify(q, terms) {
  if (document.hidden) document.title = `(${terms.length}) ${TITLE}`;
  if ("Notification" in window && Notification.permission === "granted")
    new Notification(`New in “${q}” top ${ALERT_TOP}`, { body: terms.join(", ") });
}

const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);

function renderCompare(a, b) {
  const qa = esc(a.query), qb = esc(b.query);
  // Per site, compare engagement where the site reports it, otherwise post counts.
  // Post counts are capped by each API's page size, so engagement is the better signal.
  const rows = Object.entries(KEY_NAMES).map(([k, s]) => {
    const pa = a.items.filter((i) => i.source === s), pb = b.items.filter((i) => i.source === s);
    const ea = pa.reduce((n, i) => n + (i.score || 0), 0), eb = pb.reduce((n, i) => n + (i.score || 0), 0);
    const useEng = ea + eb > 0;
    const va = useEng ? ea : pa.length, vb = useEng ? eb : pb.length;
    const failed = !a.status[k].ok || !b.status[k].ok;
    return { s, pa: pa.length, pb: pb.length, ea, eb, useEng, share: va + vb ? va / (va + vb) : null, failed };
  });
  const counted = rows.filter((r) => r.share !== null && !r.failed);
  const overall = counted.length ? counted.reduce((n, r) => n + r.share, 0) / counted.length : 0.5;
  const pct = Math.round(overall * 100);
  const lead = pct === 50 ? `Even split` : pct > 50 ? `<span class="cmp-a">${qa}</span> leads` : `<span class="cmp-b">${qb}</span> leads`;

  const rowHtml = (r) => {
    const label = (n, e) => `${n} posts${r.useEng ? ` · ${fmt(e)} engagement` : ""}`;
    const w = r.share === null ? 0 : r.share * 100;
    return `<div class="cmp-row"><span>${r.s}</span>
      <span class="bar">${r.share === null ? "" : `<i style="width:${w}%;background:var(--cmp-a)"></i><i style="width:${100 - w}%;background:var(--cmp-b)"></i>`}</span>
      <span class="n">${r.failed ? "<span>unavailable for one topic</span>" : `<span>${label(r.pa, r.ea)}</span><span>${label(r.pb, r.eb)}</span>`}</span></div>`;
  };

  const scores = (d) => new Map([...d.terms.phrases, ...d.terms.words].map((t) => [t.term, t.score]));
  const sa = scores(a), sb = scores(b);
  const maxA = Math.max(1, ...sa.values()), maxB = Math.max(1, ...sb.values());
  const shared = [...sa.keys()].filter((t) => sb.has(t))
    .sort((x, y) => (sb.get(y) / maxB + sa.get(y) / maxA) - (sb.get(x) / maxB + sa.get(x) / maxA)).slice(0, 20);
  const only = (m, other) => [...m.entries()].filter(([t]) => !other.has(t)).sort((x, y) => y[1] - x[1]).slice(0, 20).map(([t]) => t);
  const chips = (list, empty) => list.length
    ? `<div class="cloud">${list.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : `<p class="empty">${empty}</p>`;

  $("#out").innerHTML = `
    <div class="status"><span>Comparing <b class="cmp-a">${qa}</b> and <b class="cmp-b">${qb}</b></span><span>· updated ${ago(a.fetchedAt)}</span></div>
    <div class="panel">
      <h2>Who's getting more attention</h2>
      <p class="big">${lead}: <span class="cmp-a">${pct}%</span> vs <span class="cmp-b">${100 - pct}%</span>
        <span class="empty">· averaged over ${counted.length} sites</span></p>
      <div class="cmp-head"><span class="cmp-a">${qa}</span><span class="cmp-b">${qb}</span></div>
      ${rows.map(rowHtml).join("")}
      <p class="sub" style="margin-top:10px">Google Trends: ${a.googleTrends.matches.length} of today's top searches mention ${qa},
        ${b.googleTrends.matches.length} mention ${qb}.</p>
    </div>
    <div class="cmp-grid">
      <div class="panel"><h2 class="cmp-a">Only in ${qa}</h2>${chips(only(sa, sb), "Nothing unique.")}</div>
      <div class="panel"><h2>Trending in both</h2><p class="sub">Words and phrases both topics are talking about.</p>
        ${chips(shared, "No overlap right now.")}</div>
      <div class="panel"><h2 class="cmp-b">Only in ${qb}</h2>${chips(only(sb, sa), "Nothing unique.")}</div>
    </div>`;
}

// Movement since the snapshot the server compared against (undefined = no history yet)
function move(t) {
  if (t.prevRank === undefined) return "";
  if (t.prevRank === null) return `<span class="mv new">new</span>`;
  const d = t.prevRank - t.rank;
  return d > 0 ? `<span class="mv up">▲${d}</span>` : d < 0 ? `<span class="mv down">▼${-d}</span>` : "";
}

function termRow(t, max) {
  const share = (t.score / max) * 100;
  const segs = t.sources.map((s) => `<i style="width:${share / t.sources.length}%;background:${SOURCES[s]}"></i>`).join("");
  return `<div class="term ${activeTerm === t.term ? "on" : ""} ${alerts.has(t.term) ? "alert" : ""}" data-term="${esc(t.term)}">
    <span class="name">${esc(t.term)}${move(t)}</span>
    <span class="n">${t.count} posts · ${t.sources.length} site${t.sources.length > 1 ? "s" : ""}</span>
    <span class="bar">${segs}</span></div>`;
}

function spark(series) {
  const max = Math.max(...series), min = Math.min(...series), w = 70, h = 22;
  const pts = series.map((v, i) => `${(i / (series.length - 1)) * w},${h - 2 - ((v - min) / (max - min || 1)) * (h - 4)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

function render() {
  const d = data;
  const status = Object.entries(d.status).map(([k, v]) =>
    v.ok ? `<span><span class="dot" style="background:${SOURCES[KEY_NAMES[k]]}"></span>${KEY_NAMES[k]} ${v.count}</span>`
         : `<span class="bad" title="${esc(v.error)}">✕ ${KEY_NAMES[k]} unavailable</span>`).join("");

  const phrases = d.terms.phrases, words = d.terms.words;
  const maxW = Math.max(1, ...words.map((t) => t.score));
  const maxP = Math.max(1, ...phrases.map((t) => t.score));

  const gt = d.googleTrends;
  const matched = new Set(gt.matches.map((m) => m.term));
  const gtRow = (m) => `<div class="gt"><a href="https://www.google.com/search?q=${encodeURIComponent(m.term)}" target="_blank"><b>${esc(m.term)}</b></a>
      <span class="m">${esc(m.traffic)} searches</span>
      ${m.news[0] ? `<div class="m"><a href="${esc(m.news[0].url)}" target="_blank">${esc(m.news[0].title)}</a> · ${esc(m.news[0].source)}</div>` : ""}</div>`;
  // Unrelated top searches are context, not results, so they're folded away when nothing matches
  const others = gt.top.filter((t) => !matched.has(t.term));
  const gtHtml = gt.matches.length
    ? gt.matches.map(gtRow).join("") + (others.length ? `<details><summary>Other top searches today</summary>${others.map(gtRow).join("")}</details>` : "")
    : `<p class="empty">None of today's top Google searches are about “${esc(d.query)}”.</p>
       <details><summary>Show today's top searches anyway</summary>${others.map(gtRow).join("")}</details>`;

  const ch = d.changes || { comparedAt: null, dropped: {} };
  const dropped = (kind) => (ch.dropped[kind] || []).length
    ? `<p class="dropped">No longer trending: ${ch.dropped[kind].map(esc).join(", ")}</p>` : "";

  // At a glance: the top few terms and what's moving, in plain words
  const ok = Object.values(d.status).filter((v) => v.ok).length;
  const lead = (phrases.length ? phrases : words).slice(0, 3).map((t) => `<b>${esc(t.term)}</b>`);
  const movers = [...phrases.slice(0, 12), ...words.slice(0, 25)]
    .filter((t) => t.prevRank === null || t.prevRank - t.rank >= 3)
    .sort((a, b) => (b.prevRank === null) - (a.prevRank === null) || (b.prevRank - b.rank) - (a.prevRank - a.rank))
    .slice(0, 4).map((t) => `<b>${esc(t.term)}</b>${move(t)}`);
  const howToRead = `Longer bar = stronger trend · bar colours = which sites${ch.comparedAt
    ? ` · ▲▼ and NEW = change since the check ${ago(ch.comparedAt).replace("just now", "moments ago")}` : ""}`;

  const wikiHtml = d.wikipedia.length
    ? d.wikipedia.slice(0, 8).map((w) => {
        const pct = Math.round((w.change - 1) * 100);
        return `<div class="wiki"><a href="${w.url}" target="_blank">${esc(w.title)}</a>${spark(w.series)}
          <span class="${pct >= 15 ? "up" : "flat"}">${pct >= 0 ? "+" : ""}${pct}%</span></div>`;
      }).join("")
    : `<p class="empty">No Wikipedia data.</p>`;

  const banner = alerts.size
    ? `<div class="banner"><b>New in the top ${ALERT_TOP}:</b> ${[...alerts].map(esc).join(", ")}</div>` : "";

  $("#out").innerHTML = `${banner}
    <div class="panel glance">
      <h2>“${esc(d.query)}” right now</h2>
      <p class="big">Across ${d.items.length} posts from ${ok} sites in the last day or two, the biggest talking points are
        ${lead.length ? lead.join(", ") : "still unclear (not enough overlap)"}.</p>
      ${movers.length ? `<p>Moving fastest: ${movers.join(" · ")}</p>` : ""}
      <div class="status">${status}<span>· updated ${ago(d.fetchedAt)}</span></div>
    </div>

    <section>
      <h2 class="sec"><span class="num">1</span>What people are saying</h2>
      <p class="sec-sub">Words and phrases that keep coming up in posts about “${esc(d.query)}”, next to the posts themselves.
        Click a word to see only the posts that use it. <span class="howto">${howToRead}</span></p>
      <div class="grid">
        <div>
          <div class="panel">
            <h2>Trending phrases</h2>
            <p class="sub">Two-word phrases. Usually the clearest sign of what the story is.</p>
            ${phrases.length ? phrases.slice(0, 12).map((t) => termRow(t, maxP)).join("") : `<p class="empty">Not enough overlap yet.</p>`}
            ${dropped("phrases")}
          </div>
          <div class="panel">
            <h2>Trending words</h2>
            <p class="sub">Single words, ranked by how many people use them, how much engagement those posts get, and how many sites they're on.</p>
            ${words.slice(0, 25).map((t) => termRow(t, maxW)).join("")}
            ${dropped("words")}
          </div>
        </div>
        <div class="panel" id="items"></div>
      </div>
    </section>

    <section>
      <h2 class="sec"><span class="num">2</span>What people are searching and reading</h2>
      <p class="sec-sub">Signals from outside social media: what's spiking on Google and Wikipedia.</p>
      <div class="grid2">
        <div class="panel">
          <h2>Google searches today (${esc(d.geo)})</h2>
          <p class="sub">Today's top Google searches that mention your topic, with the news story behind each.</p>
          ${gtHtml}
        </div>
        <div class="panel">
          <h2>Wikipedia interest</h2>
          <p class="sub">Related articles: views over the last 2 days compared with the 2 weeks before. Green = rising.</p>
          ${wikiHtml}
        </div>
      </div>
    </section>`;

  document.querySelectorAll(".term").forEach((el) => el.onclick = () => {
    activeTerm = activeTerm === el.dataset.term ? null : el.dataset.term;
    document.querySelectorAll(".term").forEach((x) => x.classList.toggle("on", x.dataset.term === activeTerm));
    renderItems();
    if (activeTerm && innerWidth < 860) $("#items").scrollIntoView({ behavior: "smooth" });
  });
  renderItems();
}

function renderItems() {
  const d = data;
  let items = d.items;
  let hl = null;
  if (activeTerm) {
    const t = [...d.terms.phrases, ...d.terms.words].find((x) => x.term === activeTerm);
    const ids = new Set(t ? t.items : []);
    items = items.filter((i) => ids.has(i.id));
    hl = new RegExp(`(${activeTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "\\W+")})`, "gi");
  }
  const counts = { All: items.length };
  items.forEach((i) => counts[i.source] = (counts[i.source] || 0) + 1);
  if (activeSource !== "All") items = items.filter((i) => i.source === activeSource);

  // Each site gets its own top 20 by trending score (scores only compare within a site)
  const groups = Object.keys(SOURCES)
    .map((s) => ({ s, list: items.filter((i) => i.source === s).sort((a, b) => b.trend - a.trend).slice(0, PER_SOURCE) }))
    .filter((g) => g.list.length);

  const mark = (s) => hl ? esc(s).replace(hl, "<mark>$1</mark>") : esc(s);
  const filters = ["All", ...Object.keys(SOURCES)].filter((s) => counts[s])
    .map((s) => `<span class="chip ${activeSource === s ? "on" : ""}" data-src="${s}">${s} ${counts[s]}</span>`).join("");
  const row = (i) => `<div class="item">
      <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${mark(i.title)}</a></div>
      <div class="m">${esc(i.meta || "")}${i.meta ? " · " : ""}${ago(i.time)}</div>
    </div>`;

  $("#items").innerHTML = `
    <h2>Trending posts</h2>
    <p class="sub">Top ${PER_SOURCE} per site, sorted by how fast they're gaining engagement.</p>
    ${activeTerm ? `<div class="active-term">Showing posts that mention <b>${esc(activeTerm)}</b> · <a href="#" id="clear">clear</a></div>` : ""}
    <div class="filters">${filters}</div>
    ${groups.map((g) => `<h3 class="src"><span class="badge" style="background:${SOURCES[g.s]}">${g.s}</span>
        <span class="m">top ${g.list.length} of ${counts[g.s]}</span></h3>${g.list.map(row).join("")}`).join("")
      || `<p class="empty">No posts.</p>`}`;

  $("#items .filters").onclick = (e) => {
    if (!e.target.dataset.src) return;
    activeSource = e.target.dataset.src;
    renderItems();
  };
  const c = $("#clear");
  if (c) c.onclick = (e) => {
    e.preventDefault(); activeTerm = null;
    document.querySelectorAll(".term").forEach((x) => x.classList.remove("on"));
    renderItems();
  };
}

const params = new URLSearchParams(location.search);
if (params.get("geo")) $("#geo").value = params.get("geo");
if (params.get("q")) { $("#q").value = params.get("q"); search(); }
</script>
</body>
</html>
